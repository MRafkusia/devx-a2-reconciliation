<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice reconciliation workbench</title>
<meta name="description" content="Match supplier invoices against the ERP, see why every difference exists, and decide what to pay.">
<style>
:root {
  color-scheme: light dark;
  --ground: #f3f4f2;
  --surface: #ffffff;
  --ink: #18212b;
  --muted: #55606c;
  --rule: #d6dbe0;
  --primary: #1b4f8c;
  --primary-ink: #ffffff;
  --focus: #1b4f8c;
  --ok-ink: #17633f;       --ok-bg: #e1f0e5;
  --tol-ink: #3f6a12;      --tol-bg: #ecf4da;
  --mis-ink: #7a5200;      --mis-bg: #fff0c4;
  --gap-ink: #a3231b;      --gap-bg: #fadbd8;
  --dup-ink: #54389a;      --dup-bg: #ebe3f8;
  --rev-ink: #a2400a;      --rev-bg: #ffe3cc;
  --pos: #7a5200;
  --neg: #54389a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #12171d;
    --surface: #1a2129;
    --ink: #e7ecf1;
    --muted: #9aa6b2;
    --rule: #2c3641;
    --primary: #6fa8e8;
    --primary-ink: #0e1620;
    --focus: #8ec0ff;
    --ok-ink: #7fd3a0;    --ok-bg: #17301f;
    --tol-ink: #b4d77a;   --tol-bg: #26310f;
    --mis-ink: #f0c25a;   --mis-bg: #33280a;
    --gap-ink: #ff9c94;   --gap-bg: #3a1816;
    --dup-ink: #bba6f2;   --dup-bg: #272043;
    --rev-ink: #ffb07a;   --rev-bg: #382211;
    --pos: #f0c25a;
    --neg: #bba6f2;
  }
}
:root[data-theme="dark"] {
  --ground: #12171d; --surface: #1a2129; --ink: #e7ecf1; --muted: #9aa6b2; --rule: #2c3641;
  --primary: #6fa8e8; --primary-ink: #0e1620; --focus: #8ec0ff;
  --ok-ink: #7fd3a0; --ok-bg: #17301f; --tol-ink: #b4d77a; --tol-bg: #26310f;
  --mis-ink: #f0c25a; --mis-bg: #33280a; --gap-ink: #ff9c94; --gap-bg: #3a1816;
  --dup-ink: #bba6f2; --dup-bg: #272043; --rev-ink: #ffb07a; --rev-bg: #382211;
  --pos: #f0c25a; --neg: #bba6f2;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-wrap: anywhere;
}
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .875em; }

.wrap { max-width: 72rem; margin-inline: auto; padding: 1rem clamp(1rem, 4vw, 2rem) 3rem; }
header.top { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; align-items: baseline; justify-content: space-between; padding-block: 1rem .5rem; }
h1 { font-size: 1.375rem; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 1.0625rem; margin: 0 0 .75rem; }
.sub { color: var(--muted); font-size: .875rem; margin: 0; }
section { margin-top: 1.5rem; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: .5rem; padding: 1rem; }

.banner { border: 1px solid var(--rule); border-left: 4px solid var(--rev-ink); background: var(--surface); padding: .75rem 1rem; border-radius: .375rem; margin-top: 1rem; }
.banner[hidden] { display: none; }

details.run > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: .5rem; min-height: 2.75rem; }
details.run > summary::-webkit-details-marker { display: none; }
details.run > summary::before { content: ""; width: .5rem; height: .5rem; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
details.run[open] > summary::before { transform: rotate(45deg); }
.run-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); margin-top: .5rem; }
.field label { display: block; font-weight: 600; font-size: .875rem; margin-bottom: .25rem; }
.field input[type=file] { width: 100%; padding: .5rem; border: 1px dashed var(--rule); border-radius: .375rem; background: var(--ground); min-height: 2.75rem; }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; align-items: center; }
.btn { min-height: 2.75rem; padding: .5rem 1rem; border-radius: .375rem; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn:hover:not(:disabled) { filter: brightness(.96); }
#run-status { color: var(--muted); font-size: .875rem; }
#run-status.error { color: var(--gap-ink); font-weight: 600; }

.stats { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--rule); border-radius: .5rem; padding: .75rem 1rem; }
.stat .label { color: var(--muted); font-size: .8125rem; }
.stat .value { font-size: 1.5rem; font-weight: 650; letter-spacing: -.01em; }
.stat.diff { border-left: 4px solid var(--rev-ink); }
.stat.pay { border-left: 4px solid var(--ok-ink); }
.stat.hold { border-left: 4px solid var(--rev-ink); }
.stat .hint { color: var(--muted); font-size: .8125rem; margin-top: .125rem; }
.banner ul { margin: 0; padding-left: 1.25rem; }
.bridge { margin-top: 1rem; }
.bridge ul { list-style: none; margin: 0; padding: 0; }
.bridge li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .25rem 1rem; padding: .5rem 0; border-top: 1px solid var(--rule); }
.bridge .bar { grid-column: 1 / -1; height: .375rem; border-radius: 99px; background: var(--ground); overflow: hidden; }
.bridge .bar i { display: block; height: 100%; background: var(--pos); }
.bridge .bar i.neg { background: var(--neg); }
.check { margin: .75rem 0 0; font-weight: 600; }
.check.good { color: var(--ok-ink); }
.check.bad { color: var(--gap-ink); }

.toolbar { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; justify-content: space-between; margin-bottom: .75rem; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip { min-height: 2.25rem; padding: .25rem .75rem; border-radius: 99px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-size: .875rem; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.search { min-height: 2.5rem; padding: .25rem .75rem; border: 1px solid var(--rule); border-radius: .375rem; background: var(--surface); width: min(100%, 20rem); }
.downloads { display: flex; flex-wrap: wrap; gap: .5rem; }
.downloads a { font-size: .875rem; color: var(--primary); }

table.docs { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--rule); border-radius: .5rem; overflow: hidden; }
.docs th { text-align: left; font-size: .8125rem; color: var(--muted); font-weight: 600; padding: .5rem .75rem; border-bottom: 1px solid var(--rule); }
.docs td { padding: .625rem .75rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
.docs .amount { text-align: right; white-space: nowrap; }
.docs th.amount { text-align: right; }
.docs tr.doc:hover td { background: color-mix(in srgb, var(--ground) 60%, transparent); }
.docs tr.detail > td { background: var(--ground); padding: 1rem; }
.docs tr.detail[hidden] { display: none; }
.expander { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: .5rem; min-height: 2.5rem; font-weight: 600; }
.expander:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.expander::before { content: ""; width: .5rem; height: .5rem; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; flex: none; }
.expander[aria-expanded="true"]::before { transform: rotate(45deg); }
.type { color: var(--muted); font-size: .8125rem; font-weight: 400; display: block; margin-left: 1rem; }

.pill { display: inline-flex; align-items: center; gap: .375rem; padding: .125rem .625rem; border-radius: 99px; font-size: .8125rem; font-weight: 650; white-space: nowrap; }
.pill::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: currentColor; }
.s-MATCHED { color: var(--ok-ink); background: var(--ok-bg); }
.s-MATCHED_WITHIN_TOLERANCE { color: var(--tol-ink); background: var(--tol-bg); }
.s-AMOUNT_MISMATCH { color: var(--mis-ink); background: var(--mis-bg); }
.s-MISSING_IN_ERP, .s-MISSING_IN_PDF { color: var(--gap-ink); background: var(--gap-bg); }
.s-DUPLICATE_IN_ERP, .s-DUPLICATE_IN_PDF { color: var(--dup-ink); background: var(--dup-bg); }
.s-NEEDS_REVIEW { color: var(--rev-ink); background: var(--rev-bg); }
.decided { display: block; margin-top: .25rem; font-size: .75rem; color: var(--muted); }

.detail-grid { display: grid; gap: 1rem 2rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); }
.detail h3 { font-size: .8125rem; margin: 0 0 .375rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.detail p { margin: 0 0 .5rem; }
.reasons { list-style: none; margin: 0; padding: 0; display: grid; gap: .25rem; }
.reasons code { font-size: .8125rem; background: var(--surface); border: 1px solid var(--rule); border-radius: .25rem; padding: 0 .375rem; margin-right: .5rem; }
.mini { width: 100%; border-collapse: collapse; font-size: .875rem; background: var(--surface); }
.mini th, .mini td { padding: .375rem .5rem; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
.mini .amount { text-align: right; white-space: nowrap; }
.mini-scroll { overflow-x: auto; }
.decision { background: var(--surface); border: 1px solid var(--rule); border-radius: .5rem; padding: .75rem 1rem; }
.decision fieldset { border: 0; margin: 0 0 .5rem; padding: 0; display: flex; flex-wrap: wrap; gap: .25rem 1rem; }
.decision legend { font-weight: 600; font-size: .875rem; padding: 0; margin-bottom: .25rem; }
.decision label.opt { display: inline-flex; align-items: center; gap: .375rem; min-height: 2.5rem; }
.decision textarea { width: 100%; min-height: 3.5rem; padding: .5rem; border: 1px solid var(--rule); border-radius: .375rem; background: var(--ground); resize: vertical; }
.empty { text-align: center; color: var(--muted); padding: 2rem 1rem; }
footer { margin-top: 2rem; color: var(--muted); font-size: .8125rem; }

@media (max-width: 45rem) {
  .docs thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .docs, .docs tbody { display: block; background: transparent; border: 0; }
  .docs tr.doc { display: grid; grid-template-columns: 1fr 1fr; gap: .25rem 1rem; background: var(--surface); border: 1px solid var(--rule); border-radius: .5rem; margin-bottom: .5rem; padding: .5rem .75rem; }
  .docs tr.doc td { display: block; border: 0; padding: .125rem 0; }
  .docs tr.doc td:nth-child(1) { grid-column: 1 / -1; }
  .docs tr.doc td:nth-child(2) { grid-column: 1 / -1; }
  .docs td.amount { text-align: left; }
  .docs td.amount::before { content: attr(data-label); display: block; font-size: .75rem; color: var(--muted); }
  .docs tr.detail { display: block; margin: -.25rem 0 .5rem; }
  .docs tr.detail > td { display: block; border: 1px solid var(--rule); border-radius: .5rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Invoice reconciliation workbench</h1>
      <p class="sub" id="source-line">Supplier invoices against the ERP export, one decision per document.</p>
    </div>
    <div class="downloads" id="downloads" hidden></div>
  </header>

  <div class="banner" id="file-banner" hidden>
    This page is opened from disk, so it cannot reach the reconciliation engine. Start it with
    <span class="mono">python -m reconcile serve</span> and open <span class="mono">http://127.0.0.1:8000</span>.
  </div>

  <section aria-labelledby="run-heading">
    <details class="run panel" id="run-panel">
      <summary id="run-heading">Run a reconciliation</summary>
      <div class="run-grid">
        <div class="field">
          <label for="pdf-file">Supplier invoices (PDF)</label>
          <input id="pdf-file" type="file" accept="application/pdf,.pdf">
        </div>
        <div class="field">
          <label for="erp-file">ERP export (Excel)</label>
          <input id="erp-file" type="file" accept=".xlsx">
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" id="run-btn" type="button">Run reconciliation</button>
        <button class="btn" id="sample-btn" type="button">Use the bundled September sample</button>
        <span id="run-status" role="status" aria-live="polite"></span>
      </div>
    </details>
  </section>

  <div id="app"></div>
</div>

<script>
(function () {
  "use strict";

  var STATUS_TEXT = {
    MATCHED: "Matched",
    MATCHED_WITHIN_TOLERANCE: "Matched within tolerance",
    AMOUNT_MISMATCH: "Amount mismatch",
    MISSING_IN_ERP: "Missing in ERP",
    MISSING_IN_PDF: "Missing in PDF",
    DUPLICATE_IN_ERP: "Duplicate in ERP",
    DUPLICATE_IN_PDF: "Duplicate in PDF",
    NEEDS_REVIEW: "Needs review"
  };
  var DECISION_TEXT = { approve: "Approved for payment", hold: "On hold", escalate: "Escalated" };
  var DOWNLOADS = [
    ["summary.md", "Summary"],
    ["reconciliation_report.xlsx", "Excel report"],
    ["decisions.csv", "Decisions CSV"],
    ["reconciliation_report.csv", "Documents CSV"],
    ["line_discrepancies.csv", "Line discrepancies CSV"],
    ["audit_trail.csv", "Audit trail CSV"]
  ];
  var number = new Intl.NumberFormat("en-US");

  var state = { report: null, decisions: {}, filter: "all", query: "", open: {} };
  var app = document.getElementById("app");
  var runStatus = document.getElementById("run-status");

  function esc(value) {
    return String(value === null || value === undefined ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function money(n) { return number.format(n); }
  function signed(n) { return (n > 0 ? "+" : "") + number.format(n); }
  function pill(status) { return '<span class="pill s-' + esc(status) + '">' + esc(STATUS_TEXT[status] || status) + "</span>"; }

  function setStatus(text, isError) {
    runStatus.textContent = text;
    runStatus.className = isError ? "error" : "";
  }

  function request(method, url, body, headers) {
    return fetch(url, { method: method, body: body, headers: headers || {} }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        if (!response.ok) { throw new Error(data.error || ("Request failed (" + response.status + ")")); }
        return data;
      });
    });
  }

  function loadReport() {
    return Promise.all([
      request("GET", "/api/report").catch(function () { return null; }),
      request("GET", "/api/decisions").catch(function () { return {}; })
    ]).then(function (results) {
      state.report = results[0];
      state.decisions = results[1] || {};
      render();
    });
  }

  function visibleDocuments() {
    var query = state.query.trim().toLowerCase();
    return state.report.documents.filter(function (doc) {
      if (state.filter === "attention" && !doc.needs_attention) { return false; }
      if (state.filter === "clean" && doc.needs_attention) { return false; }
      if (state.filter.indexOf("status:") === 0 && doc.status !== state.filter.slice(7)) { return false; }
      if (!query) { return true; }
      var haystack = [doc.document_no, doc.status, doc.reasons.join(" "), doc.explanation, doc.erp_entries.join(" ")].join(" ").toLowerCase();
      return haystack.indexOf(query) !== -1;
    });
  }

  function count(n) { return n + (n === 1 ? " document" : " documents"); }

  function renderPayment(report) {
    var p = report.payment;
    var released = p.released.documents
      ? '<div class="stat pay"><div class="label">Released by a reviewer (' + count(p.released.documents) + ')</div><div class="value num">' + money(p.released.amount) + '</div><div class="hint">Flagged, then approved for payment</div></div>'
      : "";
    return '<section aria-labelledby="pay-h"><h2 id="pay-h">Payment position</h2><div class="stats">' +
      '<div class="stat pay"><div class="label">Cleared for payment (' + count(p.cleared.documents) + ')</div><div class="value num">' + money(p.cleared.amount) + '</div><div class="hint">PDF and ERP agree; credit notes deducted</div></div>' +
      released +
      '<div class="stat hold"><div class="label">On hold until reviewed (' + count(p.held.documents) + ')</div><div class="value num">' + money(p.held.erp_amount) + '</div><div class="hint">As booked in the ERP; ' + money(p.held.at_stake) + ' in differences to resolve</div></div>' +
      "</div></section>";
  }

  function renderBridge(report) {
    var t = report.totals;
    var largest = t.components.reduce(function (max, item) { return Math.max(max, Math.abs(item.amount)); }, 1);
    var items = t.components.map(function (item) {
      var width = Math.max(2, Math.round(Math.abs(item.amount) / largest * 100));
      return '<li><span>' + esc(item.label) + '</span><span class="num">' + signed(item.amount) + "</span>" +
        '<span class="bar" aria-hidden="true"><i class="' + (item.amount < 0 ? "neg" : "") + '" style="width:' + width + '%"></i></span></li>';
    }).join("");
    var good = t.unexplained === 0;
    return '<section aria-labelledby="bridge-h"><h2 id="bridge-h">Batch control totals</h2>' +
      '<div class="stats">' +
      '<div class="stat"><div class="label">Supplier PDF total (' + t.pdf_documents + " documents)</div><div class=\"value num\">" + money(t.pdf_total) + "</div></div>" +
      '<div class="stat"><div class="label">ERP total (' + t.erp_entries + " entries)</div><div class=\"value num\">" + money(t.erp_total) + "</div></div>" +
      '<div class="stat diff"><div class="label">Difference (PDF minus ERP)</div><div class="value num">' + signed(t.difference) + "</div></div>" +
      "</div>" +
      '<div class="panel bridge"><h2>What explains the difference</h2><ul>' + (items || "<li><span>No difference</span><span class=\"num\">0</span></li>") + "</ul>" +
      '<p class="check ' + (good ? "good" : "bad") + '">' +
      (good ? "Fully explained: the items above add up to " + signed(t.explained) + ", nothing is left over."
            : "Not fully explained: " + signed(t.unexplained) + " is left over. Check the audit trail.") + "</p></div></section>";
  }

  function renderChips(report) {
    var counts = {};
    report.documents.forEach(function (doc) { counts[doc.status] = (counts[doc.status] || 0) + 1; });
    var attention = report.documents.filter(function (doc) { return doc.needs_attention; }).length;
    var chips = [
      ["all", "All", report.documents.length],
      ["attention", "Needs attention", attention],
      ["clean", "Clean", report.documents.length - attention]
    ];
    Object.keys(STATUS_TEXT).forEach(function (status) {
      if (counts[status]) { chips.push(["status:" + status, STATUS_TEXT[status], counts[status]]); }
    });
    return chips.map(function (chip) {
      return '<button type="button" class="chip" data-filter="' + esc(chip[0]) + '" aria-pressed="' + (state.filter === chip[0]) + '">' +
        esc(chip[1]) + " (" + chip[2] + ")</button>";
    }).join("");
  }

  function lineSummary(line) {
    if (!line) { return "none"; }
    return esc(line.quantity) + " &times; " + money(line.unit_price) + (line.discount_pct ? " &minus;" + esc(line.discount_pct) + "%" : "") +
      " = <strong class=\"num\">" + money(line.amount) + "</strong>";
  }

  function renderDetail(doc, report) {
    var decision = state.decisions[doc.key];
    var reasons = doc.reasons.map(function (code) {
      return "<li><code>" + esc(code) + "</code>" + esc(report.reason_catalog[code] || "") + "</li>";
    }).join("");
    var lines = "";
    if (doc.lines.length) {
      lines = '<div><h3>Line differences</h3><div class="mini-scroll"><table class="mini"><thead><tr><th>Line</th><th>Invoice</th><th>ERP</th><th class="amount">Difference</th></tr></thead><tbody>' +
        doc.lines.map(function (line) {
          var ref = line.pdf || line.erp;
          return "<tr><td>" + esc(ref.line) + " " + esc(ref.sku) + "</td><td>" + lineSummary(line.pdf) + "</td><td>" + lineSummary(line.erp) +
            '</td><td class="amount num">' + signed(line.amount_difference) + "</td></tr>";
        }).join("") + "</tbody></table></div></div>";
    }
    var components = "";
    if (doc.components.length) {
      components = '<div><h3>How the difference builds up</h3><div class="mini-scroll"><table class="mini"><tbody>' +
        doc.components.map(function (item) {
          return "<tr><td>" + esc(item.label) + '</td><td class="amount num">' + signed(item.amount) + "</td></tr>";
        }).join("") + "</tbody></table></div></div>";
    }
    var notes = doc.notes.length ? "<div><h3>Normalised before comparing</h3><p>" + esc(doc.notes.join("; ")) + "</p></div>" : "";
    var form = "";
    if (doc.needs_attention) {
      var current = decision ? decision.decision : "";
      form = '<form class="decision" data-key="' + esc(doc.key) + '"><fieldset><legend>Your decision</legend>' +
        Object.keys(DECISION_TEXT).map(function (value) {
          return '<label class="opt"><input type="radio" name="d-' + esc(doc.key) + '" value="' + value + '"' + (current === value ? " checked" : "") + "> " + esc(DECISION_TEXT[value]) + "</label>";
        }).join("") +
        '</fieldset><label for="note-' + esc(doc.key) + '" class="sub">Note (optional)</label>' +
        '<textarea id="note-' + esc(doc.key) + '" name="note" maxlength="500">' + esc(decision ? decision.note : "") + "</textarea>" +
        '<div class="actions"><button class="btn primary" type="submit">Save decision</button><span class="sub" role="status"></span></div></form>';
    }
    return '<div class="detail-grid"><div>' +
      "<h3>What happened</h3><p>" + esc(doc.explanation) + "</p>" +
      "<h3>Suggested action</h3><p><strong>" + esc(doc.suggested_action) + "</strong></p>" +
      (reasons ? "<h3>Reason codes</h3><ul class=\"reasons\">" + reasons + "</ul>" : "") +
      "</div><div>" + lines + components + notes +
      "<h3>Where to verify</h3><p>" + (doc.pdf_source ? "Supplier PDF: <span class=\"mono\">" + esc(doc.pdf_source) + "</span><br>" : "") +
      (doc.erp_source ? "ERP: <span class=\"mono\">" + esc(doc.erp_source) + "</span>" : "") + "</p>" +
      "</div></div>" + form;
  }

  function renderRows(report) {
    var documents = visibleDocuments();
    if (!documents.length) { return '<tr><td colspan="5" class="empty">No documents match this filter.</td></tr>'; }
    return documents.map(function (doc) {
      var open = !!state.open[doc.key];
      var decision = state.decisions[doc.key];
      return '<tr class="doc"><td><button type="button" class="expander" aria-expanded="' + open + '" aria-controls="detail-' + esc(doc.key) + '" data-key="' + esc(doc.key) + '">' +
        '<span>' + esc(doc.document_no) + '<span class="type">' + (doc.type === "CREDIT_NOTE" ? "Credit note" : doc.type === "INVOICE" ? "Invoice" : "Unknown") +
        (doc.erp_entries.length ? " &middot; " + esc(doc.erp_entries.join(", ")) : "") + "</span></span></button></td>" +
        "<td>" + pill(doc.status) + (decision ? '<span class="decided">' + esc(DECISION_TEXT[decision.decision]) + "</span>" : "") + "</td>" +
        '<td class="amount num" data-label="PDF total">' + money(doc.pdf_total) + "</td>" +
        '<td class="amount num" data-label="ERP total">' + money(doc.erp_total) + "</td>" +
        '<td class="amount num" data-label="Difference">' + (doc.difference ? "<strong>" + signed(doc.difference) + "</strong>" : "0") + "</td></tr>" +
        '<tr class="detail" id="detail-' + esc(doc.key) + '"' + (open ? "" : " hidden") + '><td colspan="5">' + (open ? renderDetail(doc, report) : "") + "</td></tr>";
    }).join("");
  }

  function render() {
    var report = state.report;
    var downloads = document.getElementById("downloads");
    var runPanel = document.getElementById("run-panel");
    if (!report) {
      downloads.hidden = true;
      app.innerHTML = '<section><div class="panel empty">No reconciliation yet. Choose the two files above and run it, or use the bundled September sample.</div></section>';
      runPanel.open = true;
      return;
    }
    document.getElementById("source-line").textContent = report.meta.pdf_file + " against " + report.meta.erp_file +
      (report.meta.erp_exported_at ? " (ERP exported " + report.meta.erp_exported_at + ")" : "");
    downloads.hidden = false;
    downloads.innerHTML = DOWNLOADS.map(function (item) { return '<a href="/api/download/' + item[0] + '">' + esc(item[1]) + "</a>"; }).join("");

    var warnings = report.meta.warnings.length
      ? '<div class="banner" role="alert"><ul>' + report.meta.warnings.map(function (text) { return "<li>" + esc(text) + "</li>"; }).join("") + "</ul></div>" : "";

    app.innerHTML = warnings + renderPayment(report) + renderBridge(report) +
      '<section aria-labelledby="docs-h"><h2 id="docs-h">Documents</h2>' +
      '<div class="toolbar"><div class="chips" role="group" aria-label="Filter documents">' + renderChips(report) + "</div>" +
      '<input class="search" type="search" id="search" placeholder="Search number, reason, entry" aria-label="Search documents" value="' + esc(state.query) + '"></div>' +
      '<table class="docs"><thead><tr><th scope="col">Document</th><th scope="col">Status</th><th scope="col" class="amount">PDF total</th><th scope="col" class="amount">ERP total</th><th scope="col" class="amount">Difference</th></tr></thead><tbody id="rows">' +
      renderRows(report) + "</tbody></table></section>" +
      "<footer>Run " + esc(report.meta.run_id) + ", generated " + esc(report.meta.generated_at) + " in " + esc(report.meta.runtime_seconds) + " s. All arithmetic and matching run in code: " +
      esc(report.meta.llm_calls) + " model calls, $" + esc(report.meta.api_cost_usd.toFixed(2)) + " API cost. Differences up to IDR " + esc(report.meta.tolerance_idr) + " count as rounding.</footer>";
  }

  app.addEventListener("click", function (event) {
    var chip = event.target.closest(".chip");
    if (chip) { state.filter = chip.getAttribute("data-filter"); render(); return; }
    var expander = event.target.closest(".expander");
    if (expander) {
      var key = expander.getAttribute("data-key");
      state.open[key] = !state.open[key];
      render();
      var again = app.querySelector('.expander[data-key="' + window.CSS.escape(key) + '"]');
      if (again) { again.focus(); }
    }
  });

  app.addEventListener("input", function (event) {
    if (event.target.id === "search") {
      state.query = event.target.value;
      document.getElementById("rows").innerHTML = renderRows(state.report);
    }
  });

  app.addEventListener("submit", function (event) {
    var form = event.target.closest(".decision");
    if (!form) { return; }
    event.preventDefault();
    var message = form.querySelector("[role=status]");
    var chosen = form.querySelector("input[type=radio]:checked");
    if (!chosen) { message.textContent = "Choose a decision first."; return; }
    var key = form.getAttribute("data-key");
    request("POST", "/api/decisions", JSON.stringify({ key: key, decision: chosen.value, note: form.elements.note.value }), { "Content-Type": "application/json" })
      .then(function (data) {
        state.decisions[key] = data.saved;
        state.report.payment = data.payment;
        render();
        var again = app.querySelector('.expander[data-key="' + window.CSS.escape(key) + '"]');
        if (again) { again.focus(); }
      })
      .catch(function (error) { message.textContent = error.message; });
  });

  function setBusy(busy) {
    document.getElementById("run-btn").disabled = busy;
    document.getElementById("sample-btn").disabled = busy;
  }

  function upload(kind, file) {
    return request("POST", "/api/upload/" + kind, file, { "X-File-Name": file.name });
  }

  function runReconciliation(useSample) {
    var pdf = document.getElementById("pdf-file").files[0];
    var erp = document.getElementById("erp-file").files[0];
    setBusy(true);
    setStatus("Working: reading the PDF, running OCR on scanned pages if there are any, then matching…", false);
    var steps = Promise.resolve();
    if (!useSample) {
      if (pdf) { steps = steps.then(function () { return upload("pdf", pdf); }); }
      if (erp) { steps = steps.then(function () { return upload("erp", erp); }); }
    }
    steps.then(function () {
      return request("POST", "/api/run", JSON.stringify({ sample: !!useSample }), { "Content-Type": "application/json" });
    }).then(function (data) {
      setStatus("Done: " + data.documents + " documents in " + data.runtime_seconds + " s.", false);
      state.open = {};
      state.filter = "all";
      document.getElementById("run-panel").open = false;
      return loadReport();
    }).catch(function (error) {
      setStatus(error.message, true);
    }).then(function () { setBusy(false); });
  }

  document.getElementById("run-btn").addEventListener("click", function () { runReconciliation(false); });
  document.getElementById("sample-btn").addEventListener("click", function () { runReconciliation(true); });

  if (location.protocol === "file:") {
    document.getElementById("file-banner").hidden = false;
    document.getElementById("run-panel").hidden = true;
    app.innerHTML = "";
  } else {
    loadReport();
  }
}());
</script>
</body>
</html>
